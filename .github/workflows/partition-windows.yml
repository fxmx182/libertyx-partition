name: LibertyX Partition (Windows)

# O LibertyX Partition. O homelab é Linux: ele compila o .exe e testa o
# motor contra imagens de disco, mas a camada nativa do Windows (IOCTLs, S.M.A.R.T., VSS,
# trancar volumes, PowerShell Storage) só se prova num Windows de verdade. Este runner
# compila, roda o autoteste — leitura no disco do próprio runner e operações destrutivas
# SÓ num disco virtual criado aqui — e publica o .exe num link fixo.
on:
  push:
    branches: [main]
    # o que é só do Linux não vira versão nova do Windows
    paths-ignore:
      - "**.md"
      - "tests/**"
      - "packaging/linux/**"
      - ".github/workflows/partition-linux.yml"
      - "src/LibertyX.Partition.Core/Platform/Linux/**"
      - "src/LibertyX.Partition/SelfTestLinux.cs"
      - "src/LibertyX.Partition/ViewModels/Linux*.cs"
      - "src/LibertyX.Partition/Views/Linux*"
  workflow_dispatch:

concurrency:
  group: partition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testar e publicar
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # para publicar o release "latest"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # as novidades juntam os commits desde a versão publicada antes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # O commit vai para a versão (rodapé da barra lateral): sem isso não dá para
      # distinguir "a mudança não funcionou" de ".exe antigo aberto".
      - name: Publicar o executável
        run: |
          dotnet publish src/LibertyX.Partition/LibertyX.Partition.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:SourceRevisionId=${{ github.sha }} -p:Version=1.0.${{ github.run_number }} -o dist 2>&1 | Tee-Object build.log
          if (-not (Test-Path dist/LibertyXPartition.exe)) {
            $errs = (Select-String -Path build.log -Pattern ' error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique) -join "`n"
            $enc = $errs.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Erros de compilação::$enc"
            exit 1
          }
          Get-Item dist/LibertyXPartition.exe | Format-List Name, Length

      - name: Criar disco virtual de teste (512 MB)
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'lx-teste.vhdx'
          "create vdisk file=`"$vhd`" maximum=512 type=expandable`r`nattach vdisk" | Set-Content -Encoding ascii dp.txt
          diskpart /s dp.txt
          Get-Disk | Format-Table Number, FriendlyName, BusType, Size, PartitionStyle -AutoSize

      # O log do job só é baixável com admin no repositório; as anotações de um
      # repositório público, qualquer um lê. Cada FALHA vira anotação.
      - name: Autoteste
        run: |
          $p = Start-Process -FilePath dist\LibertyXPartition.exe -ArgumentList '--selftest','autoteste.txt','--vhd' -Wait -PassThru
          if (-not (Test-Path autoteste.txt)) { Write-Output "::error title=Autoteste::o executável não gerou relatório (código $($p.ExitCode))"; exit 1 }
          Get-Content autoteste.txt
          $falhas = Get-Content autoteste.txt | Where-Object { $_ -like 'FALHA*' }
          foreach ($f in $falhas) { $m = ($f -replace '%','%25'); Write-Output "::error title=Autoteste::$m" }
          $ultima = Get-Content autoteste.txt | Select-Object -Last 1
          Write-Output "::notice title=Autoteste::$ultima"
          $res = (Get-Content autoteste.txt | Select-String -Pattern '^(Disco |   (C:|\*|livre)|S\.M|OK|   )' | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "`n"
          Write-Output ("::notice title=Resumo::" + ($res.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')))
          exit $p.ExitCode

      # O instalador (Inno Setup): Arquivos de Programas, atalhos, desinstalação e atualização
      # por cima. É testado de verdade aqui: instala em silêncio, confere, desinstala, confere.
      - name: Montar e testar o instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=1.0.${{ github.run_number }}" installer\LibertyXPartition.iss
          if (-not (Test-Path dist\LibertyXPartition-Setup.exe)) { Write-Output "::error title=Instalador::o ISCC não gerou o Setup"; exit 1 }
          Get-Item dist\LibertyXPartition-Setup.exe | Format-List Name, Length
          $p = Start-Process dist\LibertyXPartition-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait -PassThru
          $exe = "$env:ProgramFiles\LibertyX Partition\LibertyXPartition.exe"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\LibertyX Partition.lnk"
          $desk = "$env:PUBLIC\Desktop\LibertyX Partition.lnk"
          $reg = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'LibertyX Partition' }
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $exe) -and (Test-Path $menu) -and (Test-Path $desk) -and $reg
          Write-Output "::notice title=Instalador::instalou=$($p.ExitCode) exe=$(Test-Path $exe) menu=$(Test-Path $menu) desktop=$(Test-Path $desk) versão=$($reg.DisplayVersion)"
          if (-not $ok) { Write-Output "::error title=Instalador::a instalação silenciosa não deixou tudo no lugar"; exit 1 }
          $u = Start-Process $reg.UninstallString.Trim('"') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if ((Test-Path $exe) -or (Test-Path $menu)) { Write-Output "::error title=Instalador::a desinstalação deixou arquivos"; exit 1 }
          Write-Output "::notice title=Instalador::desinstalou=$($u.ExitCode), nada sobrou"

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste
          path: autoteste.txt
          retention-days: 30

      - name: Publicar release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0,7)
          $base = "https://github.com/${{ github.repository }}/releases/download/latest"
          # novidades: os commits desde a versão no ar, sem os que são só do Linux
          $prev = ((curl.exe -sL "$base/versao.txt") -split "`n" | Where-Object { $_ -like 'commit=*' } | Select-Object -First 1) -replace '^commit=', ''
          $subjects = @()
          if ($prev) { git cat-file -e "$prev^{commit}" 2>$null; if ($LASTEXITCODE -eq 0) { $subjects = @(git log --pretty=%s "$prev..HEAD") } }
          if ($subjects.Count -eq 0) { $subjects = @(git log -1 --pretty=%s) }
          $all = @($subjects | Where-Object { $_ })
          $subjects = @($subjects | Where-Object { $_ -and $_ -notmatch '^\s*Linux\b' })
          # só commits do Linux desde a versão no ar (mesmo mexendo em arquivo comum, atrás de IsLinux):
          # o Windows foi compilado e testado, mas não vira versão nova
          if ($prev -and $all.Count -gt 0 -and $subjects.Count -eq 0) { Write-Output "::notice title=Sem versão nova::só mudanças do Linux desde a $prev"; exit 0 }
          $novidade = if ($subjects.Count -gt 0) { $subjects -join ' · ' } else { 'Correções e melhorias' }
          if ($novidade.Length -gt 400) { $novidade = $novidade.Substring(0, 400) + "…" }
          $notes = "Versão $ver, compilada de $sha e aprovada no autoteste num disco virtual do Windows.`n`nNovidades: $novidade`n`nInstalar (recomendado): $base/LibertyXPartition-Setup.exe`nPortátil, sem instalar: $base/LibertyXPartition.exe"
          # o instalador desta versão também com nome próprio: quem está baixando a anterior não toma 404
          Copy-Item dist/LibertyXPartition-Setup.exe "dist/LibertyXPartition-Setup-$ver.exe"
          $tam = (Get-Item dist/LibertyXPartition-Setup.exe).Length
          # versao.txt: o app confere atualização por download direto (a API do GitHub limita a 60/h por IP)
          "versao=$ver`ncommit=$sha`nsetup=LibertyXPartition-Setup-$ver.exe`ntamanho=$tam`nportatil=LibertyXPartition.exe`nnovidades=$novidade" | Set-Content -Encoding utf8NoBOM dist/versao.txt
          # nunca apagar o release: sobe os arquivos por cima e o versao.txt por último (só aponta para o que já está no ar)
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "LibertyX Partition (Windows) — build mais recente" --notes $notes --prerelease --target "${{ github.sha }}" }
          gh release upload latest "dist/LibertyXPartition-Setup-$ver.exe" dist/LibertyXPartition-Setup.exe dist/LibertyXPartition.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release upload latest dist/versao.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release edit latest --notes $notes
          git tag -f latest; git push -f origin refs/tags/latest
          # guarda só esta e a anterior com nome de versão
          gh release view latest --json assets --jq '.assets[].name' | ForEach-Object {
            if ($_ -match '^LibertyXPartition-Setup-1\.0\.(\d+)\.exe$' -and [int]$Matches[1] -lt ${{ github.run_number }} - 1) { gh release delete-asset latest $_ --yes }
          }
          exit 0
